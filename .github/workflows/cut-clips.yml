name: Cut Clips

on:
  repository_dispatch:
    types: [cut-clips]

jobs:
  cut:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Download source video
        run: curl -L --max-time 180 --retry 3 --retry-delay 5 --retry-connrefused -o input.mp4 "${{ github.event.client_payload.video_url }}"

      - name: Cache ffmpeg
        id: cache-ffmpeg
        uses: actions/cache@v4
        with:
          path: |
            /usr/local/bin/ffmpeg
            /usr/local/bin/ffprobe
          key: ffmpeg-static-amd64-v1

      - name: Install ffmpeg
        if: steps.cache-ffmpeg.outputs.cache-hit != 'true'
        run: |
          curl -L --max-time 120 --retry 3 --retry-delay 5 --retry-connrefused https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          sudo mv ffmpeg-*-amd64-static/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-*-amd64-static/ffprobe /usr/local/bin/

      - name: Verify ffmpeg
        run: ffmpeg -version

      - name: Cut and upload clips
        env:
          SUPABASE_URL: ${{ github.event.client_payload.supabase_url || secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ github.event.client_payload.supabase_service_role_key || secrets.SUPABASE_SERVICE_ROLE_KEY }} 
          PROJECT_ID: ${{ github.event.client_payload.project_id }}
          CLIPS_JSON: ${{ toJson(github.event.client_payload.clips) }}
          HAS_WATERMARK: ${{ github.event.client_payload.has_watermark }}
        run: |
          curl -L --max-time 60 --retry 3 --retry-delay 5 --retry-connrefused -o watermark.png https://raw.githubusercontent.com/kalaladieumerci219-creator/flukly-clipper/main/watermark.png
          echo "$CLIPS_JSON" > clips.json
          WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 input.mp4)

          process_clip() {
            local clip="$1"
            local id start end duration output subtitles WM_WIDTH
            id=$(echo "$clip" | jq -r '.id')
            start=$(echo "$clip" | jq -r '.start_time')
            end=$(echo "$clip" | jq -r '.end_time')
            duration=$(echo "$end - $start" | bc)
            output="clip-$id.mp4"
            subtitles=$(echo "$clip" | jq -r '.subtitles_ass // empty')
            WM_WIDTH=$(( 1080 * 38 / 100 ))

            if [ "$HAS_WATERMARK" = "true" ] && [ -n "$subtitles" ]; then
              printf '%s\n' "$subtitles" > "clip-$id.ass"
              timeout 300 ffmpeg -y -nostdin -ss "$start" -i input.mp4 -loop 1 -i watermark.png -t "$duration" \
                -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,ass=clip-$id.ass[subbed];[1:v]scale=$WM_WIDTH:-1,format=rgba,colorchannelmixer=aa=0.85[wm];[subbed][wm]overlay=x=W*0.08:y=H*0.14:shortest=1[outv]" \
                -map "[outv]" -map 0:a? -preset veryfast "$output"
            elif [ "$HAS_WATERMARK" = "true" ]; then
              timeout 300 ffmpeg -y -nostdin -ss "$start" -i input.mp4 -loop 1 -i watermark.png -t "$duration" \
                -filter_complex "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920[cropped];[1:v]scale=$WM_WIDTH:-1,format=rgba,colorchannelmixer=aa=0.85[wm];[cropped][wm]overlay=x=W*0.08:y=H*0.14:shortest=1[outv]" \
                -map "[outv]" -map 0:a? -preset veryfast "$output"
            elif [ -n "$subtitles" ]; then
              printf '%s\n' "$subtitles" > "clip-$id.ass"
              timeout 300 ffmpeg -y -nostdin -ss "$start" -i input.mp4 -t "$duration" -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,ass=clip-$id.ass" -preset veryfast "$output"
            else
              timeout 300 ffmpeg -y -nostdin -ss "$start" -i input.mp4 -t "$duration" -vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920" -preset veryfast -c:a copy "$output"
            fi

            curl -X POST --max-time 120 --retry 3 --retry-delay 5 --retry-connrefused "$SUPABASE_URL/storage/v1/object/Clips/$PROJECT_ID/$output" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: video/mp4" \
              --data-binary "@$output"

            local clip_url="$SUPABASE_URL/storage/v1/object/public/Clips/$PROJECT_ID/$output"

            curl -X PATCH --max-time 30 --retry 3 --retry-delay 5 --retry-connrefused "$SUPABASE_URL/rest/v1/clips?id=eq.$id" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal" \
              -d "{\"clip_url\": \"$clip_url\"}"
          }

          MAX_PARALLEL=2
          pids=()
          while read -r -u 3 clip; do
            while [ "$(jobs -rp | wc -l)" -ge "$MAX_PARALLEL" ]; do
              wait -n
            done
            process_clip "$clip" &
            pids+=("$!")
          done 3< <(jq -c '.[]' clips.json)

          fail=0
          for pid in "${pids[@]}"; do
            wait "$pid" || fail=1
          done

          if [ "$fail" -eq 1 ]; then
            echo "Un ou plusieurs clips ont échoué"
            exit 1
          fi 
