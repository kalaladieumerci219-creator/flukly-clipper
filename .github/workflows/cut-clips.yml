name: Cut Clips

on:
  repository_dispatch:
    types: [cut-clips]

jobs:
  cut:
    runs-on: ubuntu-latest
    steps:
      - name: Download source video
        run: curl -L -o input.mp4 "${{ github.event.client_payload.video_url }}"
      - name: Install ffmpeg
        run: |
          curl -L https://johnvansickle.com/ffmpeg/releases/ffmpeg-release-amd64-static.tar.xz -o ffmpeg.tar.xz
          tar -xf ffmpeg.tar.xz
          sudo mv ffmpeg-*-amd64-static/ffmpeg /usr/local/bin/
          sudo mv ffmpeg-*-amd64-static/ffprobe /usr/local/bin/
          ffmpeg -version
      - name: Cut and upload clips
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PROJECT_ID: ${{ github.event.client_payload.project_id }}
          CLIPS_JSON: ${{ toJson(github.event.client_payload.clips) }}
          HAS_WATERMARK: ${{ github.event.client_payload.has_watermark }}
        run: |
          curl -L -o watermark.png https://raw.githubusercontent.com/kalaladieumerci219-creator/flukly-clipper/main/watermark.png
          echo "$CLIPS_JSON" > clips.json
          WIDTH=$(ffprobe -v error -select_streams v:0 -show_entries stream=width -of csv=p=0 input.mp4) 
          while read -r clip; do
          
            id=$(echo "$clip" | jq -r '.id')
            start=$(echo "$clip" | jq -r '.start_time')
            end=$(echo "$clip" | jq -r '.end_time')
            duration=$(echo "$end - $start" | bc)
            output="clip-$id.mp4"
            subtitles=$(echo "$clip" | jq -r '.subtitles_ass // empty')
          echo "DEBUG subtitles length: ${#subtitles}"  

           
          WM_WIDTH=$(( WIDTH * 30 / 100 )) 

          if [ "$HAS_WATERMARK" = "true" ] && [ -n "$subtitles" ]; then
            printf '%s\n' "$subtitles" > "clip-$id.ass"
            ffmpeg -y -ss "$start" -i input.mp4 -loop 1 -i watermark.png -t "$duration" \
              -filter_complex "[0:v]ass=clip-$id.ass[subbed];[1:v]scale=$WM_WIDTH:-1,format=rgba,colorchannelmixer=aa=0.85[wm];[subbed][wm]overlay=x=W*0.08:y=H*0.14:shortest=1[outv]" \
              -map "[outv]" -map 0:a? "$output"
          elif [ "$HAS_WATERMARK" = "true" ]; then
            ffmpeg -y -ss "$start" -i input.mp4 -loop 1 -i watermark.png -t "$duration" \
              -filter_complex "[1:v]scale=$WM_WIDTH:-1,format=rgba,colorchannelmixer=aa=0.85[wm];[0:v][wm]overlay=x=W*0.08:y=H*0.14:shortest=1[outv]" \
              -map "[outv]" -map 0:a? "$output"
          elif [ -n "$subtitles" ]; then
            printf '%s\n' "$subtitles" > "clip-$id.ass"
            ffmpeg -y -ss "$start" -i input.mp4 -t "$duration" -vf ass=clip-$id.ass "$output"
          else
            ffmpeg -y -ss "$start" -i input.mp4 -t "$duration" -c copy "$output"
          fi 

            curl -X POST "$SUPABASE_URL/storage/v1/object/Clips/$PROJECT_ID/$output" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: video/mp4" \
              --data-binary "@$output"

            clip_url="$SUPABASE_URL/storage/v1/object/public/Clips/$PROJECT_ID/$output"

            curl -X PATCH "$SUPABASE_URL/rest/v1/clips?id=eq.$id" \
              -H "apikey: $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Authorization: Bearer $SUPABASE_SERVICE_ROLE_KEY" \
              -H "Content-Type: application/json" \
              -H "Prefer: return=minimal" \
              -d "{\"clip_url\": \"$clip_url\"}"
           done < <(jq -c '.[]' clips.json)  
